
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>British Telly 96</title>
<style>
:root{color-scheme:dark;--cream:#f8ebcf}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#171612;color:var(--cream);font:16px/1.4 system-ui,sans-serif}
body{padding:10px;display:flex;justify-content:center}
.app{width:100%;min-height:calc(100vh - 20px);display:flex;flex-direction:column;align-items:center;gap:12px}
header{text-align:center}
h1{margin:0;font-size:clamp(17px,2vw,26px);letter-spacing:.18em}
header small{color:#bdb09a;font-size:10px;letter-spacing:.16em}
.tv{width:min(98vw,calc((100vh - 155px)*1.30),1500px);background:linear-gradient(135deg,#795435,#49301d 35%,#68462a 60%,#382417 80%,#654328);border:clamp(9px,1.5vw,22px) solid #49301d;border-radius:clamp(18px,3vw,42px);padding:clamp(9px,1.4vw,20px);box-shadow:inset 0 0 0 3px #98704a,inset 0 0 22px #160e09,0 22px 60px #000b}
.screen{position:relative;width:100%;aspect-ratio:4/3;background:#030403;border-radius:7%/5%;overflow:hidden;isolation:isolate;box-shadow:inset 0 0 24px #000,0 0 0 5px #21170f,0 0 0 7px #98704a55}
.screen iframe{position:absolute;inset:0;width:100%;height:100%;border:0;z-index:1;background:#030403}
.screen:after{content:"";position:absolute;inset:0;z-index:4;pointer-events:none;background:radial-gradient(ellipse at center,#0000 48%,#0008 100%),linear-gradient(90deg,#0003,transparent 8%,transparent 92%,#0003);box-shadow:inset 0 0 28px #000b}
.scanlines{position:absolute;inset:0;z-index:5;pointer-events:none;background:repeating-linear-gradient(to bottom,rgba(0,0,0,.28) 0px,rgba(0,0,0,.28) 1px,transparent 1px,transparent 3px);mix-blend-mode:multiply}
.phosphor{position:absolute;inset:0;z-index:3;pointer-events:none;background:rgba(80,150,95,.035);box-shadow:inset 0 0 35px #3eaa5b10;animation:flicker 7s infinite}
@keyframes flicker{0%,96%,98%,100%{opacity:1}97%{opacity:.94}99%{opacity:.97}}
.no-signal{position:absolute;inset:0;display:grid;place-content:center;text-align:center;padding:24px;z-index:2;color:#d7e0d1;text-shadow:0 0 8px #9bd99a77}
.no-signal h2{font-size:clamp(25px,5vw,70px);letter-spacing:.12em;margin:0 0 12px}
.no-signal p{margin:0;color:#9eaa9b;font-size:clamp(11px,1.4vw,17px)}
.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
button{background:linear-gradient(#514333,#30271d);color:#fff1d2;border:1px solid #9b805c;border-radius:8px;padding:12px 18px;font-weight:750;cursor:pointer;box-shadow:0 3px 0 #17110b;min-height:44px}
button:hover{background:linear-gradient(#68543b,#3c3022)}
.status{margin:0;color:#9e927b;font-size:12px;text-align:center}
details{width:min(100%,950px);background:#29271f;padding:14px 16px;border:1px solid #514737;border-radius:9px}
summary{cursor:pointer;font-weight:750}
.admin-intro{color:#c9bfa8;font-size:13px}
.admin-tools,.admin-actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.admin-tools input{flex:1;min-width:180px}
input{width:100%;padding:10px;background:#111;color:white;border:1px solid #82765b;border-radius:5px}
.channel-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;max-height:45vh;overflow:auto;padding:2px}
.channel-row{display:grid;grid-template-columns:42px minmax(0,1fr);gap:8px;align-items:center;background:#211f19;padding:8px;border-radius:6px}
.channel-row span{font-size:12px;color:#c9bfa8;text-align:center}
.channel-row input{min-width:0}
@media(min-width:900px){.channel-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:520px){.tv{width:100%;border-width:9px;padding:8px}.channel-grid{grid-template-columns:1fr}.controls button{padding:10px 12px}}
</style>
</head>
<body>
<main class="app">
<header><h1>BRITISH TELLY '96</h1><small>THE REMOTE IS YOURS · EST. 1996 (ISH)</small></header>
<div class="tv">
  <div class="screen" id="screen">
    <div class="no-signal" id="message"><h2>NO SIGNAL</h2><p>Open Tune Your Channels to add video links.</p></div>
    <div class="phosphor"></div><div class="scanlines"></div>
  </div>
</div>
<div class="controls">
  <button type="button" onclick="changeChannel(-1)">◀ CHANNEL DOWN</button>
  <button type="button" onclick="changeChannel(1)">CHANNEL UP ▶</button>
  <button type="button" onclick="toggleFullscreen()">⛶ FULLSCREEN</button>
</div>
<p class="status" id="status">Ready to tune in.</p>
<details>
  <summary>⚙ TUNE YOUR CHANNELS</summary>
  <p class="admin-intro">Configure up to 200 YouTube links. Channel numbers are shown only in these settings, never on the TV. Links save on this browser/device.</p>
  <div class="admin-tools">
    <input id="bulk" placeholder="Paste multiple links, one per line">
    <button type="button" onclick="importBulk()">IMPORT LINKS</button>
  </div>
  <div class="channel-grid" id="editors"></div>
  <div class="admin-actions">
    <button type="button" onclick="saveChannels()">SAVE CHANNELS</button>
    <button type="button" onclick="clearChannels()">CLEAR ALL LINKS</button>
  </div>
</details>
</main>
<script>
const COUNT=200,KEY='telly96.channels.v2';
let current=0,channels=loadChannels();

function loadChannels(){
  try{
    let a=JSON.parse(localStorage.getItem(KEY)||'null');
    if(!Array.isArray(a))a=JSON.parse(localStorage.getItem('telly96')||'null');
    if(Array.isArray(a))return Array.from({length:COUNT},(_,i)=>String(a[i]||''));
  }catch(e){}
  return Array(COUNT).fill('');
}
function videoId(value){
  const s=String(value||'').trim();
  const m=s.match(/(?:youtu\.be\/|youtube(?:-nocookie)?\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/))([\w-]{11})/);
  if(m)return m[1];
  return /^[\w-]{11}$/.test(s)?s:'';
}
function renderEditors(){
  const root=document.getElementById('editors');root.replaceChildren();
  const frag=document.createDocumentFragment();
  channels.forEach((url,i)=>{
    const row=document.createElement('label');row.className='channel-row';
    const n=document.createElement('span');n.textContent=String(i+1).padStart(3,'0');
    const input=document.createElement('input');input.id='url'+i;input.value=url;input.placeholder='Paste video link';input.setAttribute('aria-label','Setup link for channel '+(i+1));
    row.append(n,input);frag.append(row);
  });
  root.append(frag);
}
function showMessage(title,subtitle){
  const msg=document.getElementById('message');msg.style.display='grid';msg.replaceChildren();
  const h=document.createElement('h2');h.textContent=title;
  const p=document.createElement('p');p.textContent=subtitle;msg.append(h,p);
}
function tune(index){
  current=(index+COUNT)%COUNT;
  const screen=document.getElementById('screen');
  const old=screen.querySelector('iframe');if(old)old.remove();
  const id=videoId(channels[current]);
  if(id){
    document.getElementById('message').style.display='none';
    const frame=document.createElement('iframe');
    frame.src='https://www.youtube-nocookie.com/embed/'+id+'?autoplay=1&rel=0';
    frame.title='Television picture';frame.allow='autoplay; encrypted-media; picture-in-picture; fullscreen';frame.allowFullscreen=true;
    screen.insertBefore(frame,screen.firstChild);
    document.getElementById('status').textContent='Tuned in. Use the channel buttons to surf.';
  }else{
    showMessage('NO SIGNAL','Add a video link in Tune Your Channels.');
    document.getElementById('status').textContent='No video assigned to this channel.';
  }
}
function changeChannel(d){tune(current+d)}
function saveChannels(){
  channels=Array.from({length:COUNT},(_,i)=>document.getElementById('url'+i).value.trim());
  localStorage.setItem(KEY,JSON.stringify(channels));tune(current);
  document.getElementById('status').textContent='Channel links saved on this device.';
}
function importBulk(){
  const text=document.getElementById('bulk').value.trim();if(!text)return;
  const links=text.split(/\n+/).map(s=>s.trim()).filter(Boolean);let slot=0;
  for(let i=0;i<COUNT&&slot<links.length;i++)if(!channels[i])channels[i]=links[slot++];
  renderEditors();document.getElementById('bulk').value='';
  document.getElementById('status').textContent='Imported '+slot+' link(s). Press SAVE CHANNELS to keep them.';
}
function clearChannels(){
  if(!confirm('Clear all 200 channel links saved on this device?'))return;
  channels=Array(COUNT).fill('');localStorage.setItem(KEY,JSON.stringify(channels));renderEditors();tune(current);
}
function toggleFullscreen(){
  if(!document.fullscreenElement){document.documentElement.requestFullscreen?.().catch(()=>{});}
  else document.exitFullscreen?.();
}
document.addEventListener('keydown',e=>{
  if(e.target instanceof HTMLInputElement)return;
  if(e.key==='ArrowUp'||e.key==='ArrowRight'){e.preventDefault();changeChannel(1)}
  if(e.key==='ArrowDown'||e.key==='ArrowLeft'){e.preventDefault();changeChannel(-1)}
});
renderEditors();tune(0);
</script>
</body>
</html>
